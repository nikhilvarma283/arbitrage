[mypy]
ignore_missing_imports = True

# main.py, pool_watcher.py, and pool_discovery.py are legacy/superseded --
# main_v3.py + pool_watcher_v2.py are the actively used pipeline now (see
# docker-compose.yml / config, which run main_v3.py). These older files
# were never updated when Ledger's real API (log_cycle/get_funnel_report)
# diverged from what they call (log_opportunity/get_daily_summary, which
# don't exist), plus older algosdk-response-type handling that was cleaned
# up in pool_watcher_v2.py. Excluding them here rather than either fixing
# dead code or deleting files that may still be wanted for reference.
[mypy-src.main]
ignore_errors = True

[mypy-src.pool_watcher]
ignore_errors = True

[mypy-src.pool_discovery]
ignore_errors = True
