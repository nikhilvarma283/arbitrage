app:
  mode: "shadow"
  name: "Algorand Multi-DEX Atomic Arbitrage Bot"
  version: "3.0-option-a"

blockchain:
  network: "mainnet"
  # Using AlgoNode public mainnet API
  algod_host: "mainnet-api.algonode.cloud"
  algod_port: 443
  algod_token: ""
  use_https: true

# NOTE: pool identification is NOT read from this section. main_v3.py always
# loads config/pools.lock.json for the actual pool list (app ids / addresses,
# asset pairs, protocol, fees). This "dexes" block is kept only as
# human-readable documentation of DEX-level settings that ARE used
# (enabled flags, API endpoints) -- see pools.lock.json for the real pools.
dexes:
  tinyman_v2:
    enabled: true
    validator_app: 1002541853
  pact:
    enabled: true
    api_endpoint: "https://api.pact.fi"
  humble_swap:
    enabled: false  # excluded: see pools.lock.json notes (unresolved wrapped asset ids)

# Asset definitions (from CHANGE 6)
# USDT = 312769 ("Tether USDt" on mainnet). A prior config used 793589522,
# which is not a real asset on mainnet -- corrected 2026-07-19.
assets:
  ALGO:
    id: 0
    decimals: 6
    verified: true
  USDC:
    id: 31566704
    decimals: 6
    verified: true
  USDT:
    id: 312769
    decimals: 6
    verified: true
  goBTC:
    id: 386192725
    decimals: 8
    verified: false  # TODO: verify via indexer
  goETH:
    id: 386195940
    decimals: 8
    verified: false  # TODO: verify via indexer

# Opportunity detection gates (CHANGE 4, 5)
gates:
  # Raw spread (before fees)
  spread_gate_bps: 30

  # Breakeven is computed dynamically per-cycle from each involved pool's
  # real, live fee_bps (see cycle_detector.py) rather than a static
  # two_hop/three_hop bps assumption -- Tinyman pools currently charge
  # 36bps, not the 30bps a static assumption would use, and a 3-hop route
  # touching a mix of DEXes has a different real cost than an all-Tinyman
  # loop. breakeven_margin is the required cushion beyond breakeven, as a
  # fraction of the real fee cost (0.05 = net gain must be at least 5% of
  # what was actually paid in fees).
  breakeven_margin: 0.05

  # Minimum profit to execute
  min_profit_usd: 0.75

# Triangular arbitrage paths (max 3 hops - CHANGE 5)
triangular_paths:
  # ALGO → USDC → USDT → ALGO
  - hops:
      - assets: [0, 31566704]
      - assets: [31566704, 312769]
      - assets: [312769, 0]
    max_size_usdc: 2000
    name: "ALGO ↔ USDC ↔ USDT"

  # ALGO → USDT → USDC → ALGO (reverse)
  - hops:
      - assets: [0, 312769]
      - assets: [312769, 31566704]
      - assets: [31566704, 0]
    max_size_usdc: 2000
    name: "ALGO ↔ USDT ↔ USDC"

# Event-driven scanning (CHANGE 1)
watcher:
  # Only recompute when pools change (not every block)
  event_driven: true

  # Metrics to track
  metrics:
    - pools_updated_count
    - cycles_rechecked_count
    - avg_staleness_ms

# Simulation & staleness (CHANGE 2)
simulator:
  enabled: true
  # Simulate every detected opportunity (fee gate pass)
  # Measure staleness: detection → simulate wall-clock time
  log_staleness: true

# Ledger & reporting (CHANGE 3, 7)
ledger:
  database_path: "/data/ledger.db"
  # Log ALL cycles (not just winners)
  log_all_cycles: true

  # Daily Parquet export
  export_format: "parquet"
  export_path: "/data/parquet"

# Gate 0 acceptance criteria (CHANGE 7)
gate0:
  duration_days: [14, 30]  # Run for 14-30 days
  acceptance_criteria:
    - would_execute_per_day: 10  # >= 10/day average
    - median_profit_usd: 0.75     # >= $0.75 median
    - staleness_win_rate: 0.40    # >= 40% win rate from staleness decay
  stop_threshold: 5  # Stop if < 5/day (market not active enough)

# Logging
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "/data/logs/bot.log"
