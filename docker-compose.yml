version: '3.8'

services:
  # Main arbitrage bot v3 (multi-DEX, event-driven, query API)
  #
  # Talks to the public AlgoNode mainnet API (config/bot.multi-dex.yaml's
  # algod_host), not a local node. A local `algod` service used to run
  # here too -- it was never actually used (nothing pointed at it) and
  # was found consuming 442% CPU / 3.12TB block I/O syncing mainnet for
  # no reason, which throttled the whole VPS. Removed.
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arbitrage-bot
    environment:
      - APP_MODE=shadow
      - LOG_LEVEL=INFO
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    ports:
      - "8000:8000"
    volumes:
      - ./config/bot.multi-dex.yaml:/app/config/bot.multi-dex.yaml
      - ./config/pools.lock.json:/app/config/pools.lock.json
      - ./config/.env:/app/config/.env
      - bot_data:/data
      - ./src:/app/src
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"

  # Optional: Prometheus monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: arbitrage-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    restart: unless-stopped
    profiles:
      - monitoring

  # Optional: Grafana dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: arbitrage-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    restart: unless-stopped
    profiles:
      - monitoring
    depends_on:
      - prometheus

volumes:
  bot_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  default:
    name: arbitrage-network
